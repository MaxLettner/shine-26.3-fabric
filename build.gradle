plugins {
	// 26.x is unobfuscated: plain Loom plugin, no mappings, no remapping.
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	maven { name = "TerraformersMC"; url = "https://maven.terraformersmc.com/releases/" }
	maven { name = "isXander"; url = "https://maven.isxander.dev/releases" }
	maven {
		name = "Modrinth"
		url = "https://api.modrinth.com/maven"
		content { includeGroup "maven.modrinth" }
	}
}

loom {
	mods {
		"shine" {
			sourceSet sourceSets.main
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

	// YACL (config screen UI)
	implementation "dev.isxander:yet-another-config-lib:${project.yacl_version}"

	// Mod Menu: optional for users, present in dev runtime.
	compileOnly "com.terraformersmc:modmenu:${project.modmenu_version}"
	localRuntime "com.terraformersmc:modmenu:${project.modmenu_version}"

	// Sodium compile stubs for optional compatibility mixins.
	compileOnly "maven.modrinth:sodium:${project.sodium_version}"
	// Test with Sodium in the dev client: ./gradlew runClient -PwithSodium
	if (project.hasProperty("withSodium")) {
		localRuntime "maven.modrinth:sodium:${project.sodium_version}"
	}
}

processResources {
	def version = project.version
	inputs.property "version", version
	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	def archivesName = project.base.archivesName.get()
	inputs.property "archivesName", archivesName
	from("LICENSE.md") {
		rename { "${it}_${archivesName}" }
	}
}

publishing {
	publications {
		create("mavenJava", MavenPublication) {
			artifactId = project.archives_base_name
			from components.java
		}
	}
}
